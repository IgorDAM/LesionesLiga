spring.application.name=lesiones-liga
server.port=${PORT:8080}
server.error.include-message=always
# Detrás del proxy de Azure: usar la IP real del cliente (límite de intentos del panel de administración)
server.forward-headers-strategy=native
# Los ficheros estáticos se revalidan siempre (304 si no cambian): así un despliegue nuevo se ve al instante
spring.web.resources.cache.cachecontrol.no-cache=true

# --- Base de datos local: H2 en fichero (./data/lesiones.mv.db). Cero instalación. ---
spring.datasource.url=jdbc:h2:file:./data/lesiones
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Aplicación ---
# Define ADMIN_TOKEN en el entorno antes de publicar. Con el valor por defecto se avisa en el log.
app.admin-token=${ADMIN_TOKEN:cambia-esto}
# Por debajo de este número de casos cerrados, las medias se marcan como poco fiables.
app.minimo-casos=5
