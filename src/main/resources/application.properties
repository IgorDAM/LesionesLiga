spring.application.name=lesiones-liga
server.port=${PORT:8080}
server.error.include-message=always

# --- Base de datos local: H2 en fichero (./data/lesiones.mv.db). Cero instalación. ---
spring.datasource.url=jdbc:h2:file:./data/lesiones
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# --- Aplicación ---
# Define ADMIN_TOKEN en el entorno antes de publicar. Con el valor por defecto se avisa en el log.
app.admin-token=${ADMIN_TOKEN:cambia-esto}
# Por debajo de este número de casos cerrados, las medias se marcan como poco fiables.
app.minimo-casos=5
