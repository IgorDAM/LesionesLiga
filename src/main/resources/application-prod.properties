# Perfil de producción (SPRING_PROFILES_ACTIVE=prod). Sirve para cualquier base JDBC con driver incluido:
# Azure SQL Database (recomendado, ver AZURE.md), PostgreSQL (Neon, Azure Database for PostgreSQL...).
#
# Variables de entorno necesarias:
#   DATABASE_URL       Azure SQL:  jdbc:sqlserver://SERVIDOR.database.windows.net:1433;database=BASE;encrypt=true;trustServerCertificate=false;loginTimeout=90
#                      PostgreSQL: jdbc:postgresql://HOST/BASE?sslmode=require
#                      MySQL:      jdbc:mysql://HOST:3306/BASE?sslMode=REQUIRED&serverTimezone=Europe/Madrid
#                                  (en tu PC sin SSL: jdbc:mysql://localhost:3306/BASE?serverTimezone=Europe/Madrid)
#   DATABASE_USER
#   DATABASE_PASSWORD
#   ADMIN_TOKEN        contraseña larga y aleatoria para el panel de administración
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

# Las bases serverless gratuitas se pausan cuando no se usan y tardan en despertar (hasta ~1 minuto).
# Se espera al arrancar y al pedir conexión en lugar de fallar de inmediato.
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.connection-timeout=90000
